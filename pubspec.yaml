name: gpa_tracker
description: GPA Tracker & Career Intelligence - Academic performance analytics with career readiness insights
publish_to: 'none' # Private app - not published to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    equatable: ^2.0.8


  # UI Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.1.0

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Data Visualization & Charts
  fl_chart: ^1.1.1

  # Utilities
  equatable: ^2.0.8        # Value equality for domain models
  uuid: ^4.5.2             # Unique ID generation
  intl: ^0.20.2            # Date/number formatting

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Assets (uncomment and add files as needed)
  # assets:
  #   - assets/images/
  #   - assets/data/career_sectors.json

